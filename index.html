<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon1.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumix📷</title>
  </head>
  <body>


    <div id="app">

         <div id="left">

          <div id="left-top">
             
             <div>
               <label for="image-input"  class="filter-btns filter-btn1">Choose Image</label>
                <input type="file" name="image-input" id="image-input" hidden>
             </div>
             <button class="filter-btns filter-btn2 reset-btn">Reset</button>
             <button class="filter-btns filter-btn3 download-btn">Download</button>

          </div>

          <div id="left-bottom">
               <div id="placeholder-image">
                  <i class="ri-image-add-line"></i>
                  <p>No image chosen</p>
               </div>

               <canvas id="image-canvas" hidden></canvas>

          </div>

         </div>


         <div id="right">


           <div class="filters-container">
               <h2>Filters</h2>
               <div id="filters"> </div>

           </div>

           <div class="presets-container">
               <h2>Presets</h2>
               <div id="presets-btns">
                 <!-- <button>Drama</button>
                 <button>Drama</button>
                 <button>Drama</button> -->
               </div>
           </div>
           
           

         </div>

        

    </div>


    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
